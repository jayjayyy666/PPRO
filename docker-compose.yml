version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: drevenka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevenka
      POSTGRES_USER: drevenka_user
      POSTGRES_PASSWORD: drevenka_secure_password
    ports:
      - "5432:5432"
    volumes:
      - drevenka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drevenka_user -d drevenka"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: drevenka_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://drevenka_user:drevenka_secure_password@db:5432/drevenka
      SQL_ECHO: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  drevenka_pgdata:
